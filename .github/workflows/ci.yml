name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: cdk synth (cdk-nag gate)
        run: pnpm --filter infra synth -q

  deploy-dev:
    # Requires repo variable AWS_DEPLOY_ROLE_ARN: an IAM role trusted for GitHub OIDC
    # (token.actions.githubusercontent.com, sub = repo:<org>/<repo>:environment:dev).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: verify
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      - name: cdk deploy (dev)
        run: >
          pnpm --filter infra exec cdk deploy --require-approval never -c env=dev
          ${{ vars.GOOGLE_SECRET_NAME && format('-c googleSecretName={0}', vars.GOOGLE_SECRET_NAME) || '' }}
