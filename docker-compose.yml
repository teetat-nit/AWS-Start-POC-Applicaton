# Local AWS stand-ins for development (Docker / Rancher Desktop).
# Not required: set DB_DRIVER=memory in apps/api/.env to run without Docker.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    user: root

volumes:
  dynamodb-data:
